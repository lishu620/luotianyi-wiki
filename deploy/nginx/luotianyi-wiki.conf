# ---------- 洛天依 Wiki：宿主机 nginx-proxy 站点配置 ----------
# 部署位置：/root/nginx/conf.d/luotianyi-wiki.conf
# 生效方式：docker exec nginx-proxy nginx -s reload
#
# 上游为 docker compose 暴露在宿主机回环地址上的 web 容器（Nginx），
# 该容器内部已处理 /api 反代与 SPA 回退，这里只做统一入口与安全响应头。

server {
    listen 80;
    server_name luotianyi.wiki;

    # 隐藏上游服务信息，交由这里的响应头统一控制
    proxy_hide_header X-Powered-By;

    # 表情广场上传（与 web 容器内的 client_max_body_size 保持一致）
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Flexible：回源为 HTTP，但告知后端用户实际使用 HTTPS
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
