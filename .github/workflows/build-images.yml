name: 构建并推送镜像

# 目的：把 api / web 镜像在 GitHub 的机器上构建好推到 GHCR，
#       性能较弱（或内存不足）的服务器只需 `docker compose pull` 即可运行，无需本地构建。
#
# 产物：
#   ghcr.io/<owner>/<repo>-api:latest , :<commit-sha>
#   ghcr.io/<owner>/<repo>-web:latest , :<commit-sha>
#
# 用法：服务器上执行 `bash deploy/deploy.sh --prebuilt`
# 注意：首次运行后请到 https://github.com/<owner>?tab=packages 把两个 Package 设为 public，
#       否则服务器拉取前需要 `docker login ghcr.io`。

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/Dockerfile.api"
      - "deploy/Dockerfile.web"
      - "deploy/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "额外推送的标签（可选，例如 v1.0.0）"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
            description: 后端（NestJS + Fastify）
          - name: web
            dockerfile: deploy/Dockerfile.web
            description: 前端（Vite 构建 + Nginx 托管）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.name }}（${{ matrix.description }}）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # 生成普通 manifest（不加 attestation），避免部分旧版 Docker 拉取时报找不到匹配的 manifest
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 汇总
        run: |
          echo "### ${{ matrix.name }} 已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
